<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwimPay — Gestione Meeting</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blu-fondo:#0a1628;
  --corsia-1:#0d2137;
  --corsia-2:#0f2a45;
  --acqua-scura:#0e3a5c;
  --acqua-media:#1565a0;
  --acqua-chiara:#1e88e5;
  --acqua-brillante:#42b4f5;
  --acqua-shimmer:#7dd3fc;
  --corda:#f59e0b;
  --oro:#fbbf24;
  --verde:#22c55e;
  --rosso:#ef4444;
  --testo:#f0f9ff;
  --testo-sec:#7dd3fc;
  --testo-mut:#4a7fa5;
  --sup-1:#0d2137;
  --sup-2:#112840;
  --sup-3:#163354;
  --bordo:rgba(66,180,245,0.15);
  --bordo-att:rgba(66,180,245,0.4);
}
body{background:var(--blu-fondo);color:var(--testo);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}

/* CORSIE SFONDO */
.corsie{position:fixed;inset:0;z-index:0;
  background:repeating-linear-gradient(180deg,
    var(--corsia-1) 0,var(--corsia-1) 58px,
    rgba(66,180,245,0.09) 58px,rgba(66,180,245,0.09) 60px,
    var(--corsia-2) 60px,var(--corsia-2) 118px,
    rgba(66,180,245,0.09) 118px,rgba(66,180,245,0.09) 120px
  );opacity:.65}
.corsie::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,22,40,.95) 0%,rgba(10,22,40,.6) 50%,rgba(10,22,40,.95) 100%)}

.guscio{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
.header{display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:rgba(13,33,55,.97);border-bottom:1px solid var(--bordo);
  position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-ico{width:38px;height:38px;border-radius:8px;
  background:linear-gradient(135deg,var(--acqua-media),var(--acqua-brillante));
  display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-nome{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:2px;color:var(--acqua-brillante)}
.logo-sub{font-size:10px;color:var(--testo-mut);letter-spacing:2px;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto}
.nav-btn{padding:7px 14px;border-radius:6px;border:1px solid transparent;
  background:transparent;color:var(--testo-mut);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;transition:all .2s}
.nav-btn:hover,.nav-btn.attivo{background:var(--sup-3);color:var(--acqua-brillante);border-color:var(--bordo-att)}

/* MAIN */
.main{flex:1;padding:22px;max-width:1160px;margin:0 auto;width:100%}
.titolo-sez{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;
  letter-spacing:2px;color:var(--testo);margin-bottom:18px;text-transform:uppercase}
.onda{height:3px;margin-bottom:20px;border-radius:2px;opacity:.5;
  background:repeating-linear-gradient(90deg,
    var(--acqua-media) 0,var(--acqua-media) 8px,transparent 8px,transparent 12px,
    var(--corda) 12px,var(--corda) 16px,transparent 16px,transparent 20px)}

/* CARDS */
.card{background:var(--sup-2);border:1px solid var(--bordo);border-radius:12px;padding:18px;margin-bottom:14px}
.card-titolo{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;
  color:var(--acqua-brillante);margin-bottom:14px;letter-spacing:.5px}

/* BOTTONI */
.btn{padding:8px 16px;border-radius:7px;border:none;cursor:pointer;
  font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;transition:all .2s}
.btn-primario{background:var(--acqua-media);color:#fff}.btn-primario:hover{background:var(--acqua-chiara)}
.btn-fantasma{background:transparent;color:var(--testo-sec);border:1px solid var(--bordo)}.btn-fantasma:hover{border-color:var(--bordo-att);color:var(--acqua-brillante)}
.btn-successo{background:#166534;color:#bbf7d0}.btn-successo:hover{background:#15803d}
.btn-pericolo{background:#7f1d1d;color:#fca5a5}.btn-pericolo:hover{background:#991b1b}
.btn-oro{background:#92400e;color:#fde68a}.btn-oro:hover{background:#b45309}
.btn-sm{padding:4px 10px;font-size:11px}

/* INPUT */
.fg{margin-bottom:12px}
.etichetta{display:block;font-size:10px;font-weight:700;color:var(--testo-mut);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.inp{width:100%;padding:9px 12px;border-radius:7px;background:var(--sup-1);
  border:1px solid var(--bordo);color:var(--testo);font-family:'Barlow',sans-serif;
  font-size:14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--bordo-att)}
select.inp{cursor:pointer}
.griglia2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.griglia3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.griglia4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* STATISTICHE */
.stat-card{background:var(--sup-1);border:1px solid var(--bordo);border-radius:10px;padding:14px}
.stat-valore{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;margin-top:4px}
.stat-etichetta{font-size:10px;font-weight:700;color:var(--testo-mut);text-transform:uppercase;letter-spacing:1px}

/* TABELLA */
.tabella{width:100%;border-collapse:collapse;font-size:13px}
.tabella th{padding:9px 10px;text-align:left;font-size:10px;font-weight:700;
  letter-spacing:1.5px;color:var(--testo-mut);text-transform:uppercase;border-bottom:1px solid var(--bordo)}
.tabella td{padding:9px 10px;border-bottom:1px solid rgba(66,180,245,.05)}
.tabella tr:hover td{background:rgba(66,180,245,.04)}

/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.b-blu{background:rgba(30,136,229,.18);color:#7dd3fc}
.b-verde{background:rgba(34,197,94,.18);color:#86efac}
.b-oro{background:rgba(251,191,36,.18);color:#fde68a}
.b-rosso{background:rgba(239,68,68,.18);color:#fca5a5}
.b-viola{background:rgba(168,85,247,.18);color:#d8b4fe}
.b-grigio{background:rgba(100,116,139,.18);color:#94a3b8}
.b-arancio{background:rgba(249,115,22,.18);color:#fdba74}

/* AVATAR */
.avatar{width:30px;height:30px;border-radius:50%;background:var(--acqua-scura);
  border:1px solid var(--bordo);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--acqua-brillante);flex-shrink:0}

/* TOGGLE */
.toggle{display:flex;gap:3px;background:var(--sup-1);border-radius:7px;padding:3px}
.topt{padding:5px 12px;border-radius:5px;border:none;cursor:pointer;
  font-size:12px;font-weight:600;background:transparent;color:var(--testo-mut);transition:all .2s}
.topt.attivo{background:var(--acqua-media);color:#fff}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(5,12,25,.87);
  z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--sup-2);border:1px solid var(--bordo-att);
  border-radius:14px;padding:22px;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto}
.modal-titolo{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;
  color:var(--acqua-brillante);margin-bottom:18px;letter-spacing:.5px}
.modal-azioni{display:flex;gap:8px;justify-content:flex-end;
  margin-top:18px;padding-top:14px;border-top:1px solid var(--bordo)}

/* RICERCA */
.ricerca{display:flex;align-items:center;gap:8px;background:var(--sup-1);
  border:1px solid var(--bordo);border-radius:7px;padding:7px 12px;margin-bottom:14px}
.ricerca input{background:transparent;border:none;outline:none;color:var(--testo);flex:1;font-size:13px}

/* ATLETA SELEZIONABILE */
.atl-sel{display:flex;align-items:center;gap:8px;padding:9px 11px;
  border-radius:8px;border:1px solid var(--bordo);cursor:pointer;transition:all .2s;margin-bottom:5px}
.atl-sel:hover{border-color:var(--bordo-att);background:rgba(66,180,245,.04)}
.atl-sel.selezionato{border-color:var(--acqua-media);background:rgba(21,101,160,.14)}
.checkbox{width:17px;height:17px;border-radius:4px;border:2px solid rgba(66,180,245,.25);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.checkbox.attivo{background:var(--acqua-media);border-color:var(--acqua-media)}

/* PILLOLA INFO */
.pillola{display:inline-flex;align-items:center;gap:5px;background:rgba(21,101,160,.14);
  border:1px solid rgba(66,180,245,.18);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--testo-sec)}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(21,101,160,.12);
  border:1px solid rgba(66,180,245,.15);border-radius:5px;padding:4px 10px;font-size:12px;color:var(--testo-sec);font-weight:600}

/* BARRA PROGRESSO */
.barra-wrap{height:5px;background:var(--sup-1);border-radius:3px;overflow:hidden;margin-top:3px}
.barra-fill{height:100%;border-radius:3px;transition:width .3s}

/* NOTE */
.note-box{background:var(--sup-1);border-left:3px solid var(--acqua-media);
  border-radius:0 7px 7px 0;padding:11px 14px;font-size:13px;color:var(--testo-sec);
  white-space:pre-wrap;line-height:1.5}

/* SEZIONE CONFIG */
.cfg{background:rgba(21,101,160,.08);border:1px solid rgba(66,180,245,.18);
  border-radius:8px;padding:14px;margin-bottom:14px}
.cfg-titolo{font-size:11px;font-weight:800;color:var(--oro);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

/* INPUT PAGAMENTO */
.inp-pag{width:100%;padding:5px 8px;border-radius:5px;text-align:center;
  background:var(--sup-3);border:1px solid var(--bordo);color:var(--testo);font-size:13px;outline:none}
.inp-pag:focus{border-color:var(--bordo-att)}

/* SETUP */
.setup-wrap{max-width:480px;margin:50px auto;text-align:center}

/* VUOTO */
.vuoto{text-align:center;padding:40px 20px;color:var(--testo-mut)}
.vuoto-ico{font-size:40px;margin-bottom:10px;opacity:.35}
.vuoto-testo{font-size:15px;color:var(--testo-sec);margin-bottom:5px}
.vuoto-sub{font-size:12px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;z-index:9999;
  background:var(--sup-3);border:1px solid var(--bordo-att);
  border-radius:8px;padding:11px 16px;font-size:13px;font-weight:500;
  animation:toastIn .25s ease;pointer-events:none}
.toast.ok{border-color:rgba(34,197,94,.45);color:#86efac}
.toast.err{border-color:rgba(239,68,68,.45);color:#fca5a5}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* PREFORMATTED */
.pre{background:var(--sup-1);padding:10px;border-radius:7px;font-size:10px;
  color:var(--testo-sec);overflow-x:auto;text-align:left;margin-top:8px;
  line-height:1.6;white-space:pre-wrap;word-break:break-all}

/* ROW PAGAMENTO */
.riga-pag{display:grid;gap:8px;padding:5px 0;
  border-bottom:1px solid rgba(66,180,245,.05);align-items:center}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--blu-fondo)}
::-webkit-scrollbar-thumb{background:var(--acqua-scura);border-radius:2px}

@media(max-width:600px){
  .griglia2,.griglia3,.griglia4{grid-template-columns:1fr}
  .nav-btn{padding:6px 8px;font-size:12px}
  .main{padding:14px}
}
</style>
</head>
<body>
<div class="corsie"></div>
<div class="guscio" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════
// STATO GLOBALE
// ═══════════════════════════════════════════════════════════
const DB = { atleti:[], meetings:[], config:null, sb:null };

// ═══════════════════════════════════════════════════════════
// LOCAL STORAGE
// ═══════════════════════════════════════════════════════════
const LS = {
  prendi: k => { try { return JSON.parse(localStorage.getItem('sp_'+k)||'null') } catch { return null } },
  salva:  (k,v) => { try { localStorage.setItem('sp_'+k, JSON.stringify(v)) } catch {} },
};

// ═══════════════════════════════════════════════════════════
// CATEGORIE FIN — STAGIONE 2025/2026
// L'età si calcola come: anno_fine_stagione - anno_nascita
// Anno fine stagione 2025/2026 = 2026
// ═══════════════════════════════════════════════════════════
function catFIN(dataNascita, sesso, gruppo) {
  if (!dataNascita || !sesso) return {cat:'--', badge:'b-grigio'};
  try {
    const parti = dataNascita.split('/');
    if (parti.length < 3) return {cat:'--', badge:'b-grigio'};
    const annoNascita = parseInt(parti[2]);
    const mese = parseInt(parti[1]);
    if (isNaN(annoNascita) || isNaN(mese)) return {cat:'--', badge:'b-grigio'};

    // Stagione 2025/2026: inizia 1/10/2025, finisce 30/9/2026
    // Anno di riferimento FIN = anno finale stagione = 2026
    const ANNO_REF = 2026;
    const eta = ANNO_REF - annoNascita;

    // Master: fasce quinquennali da 25 anni
    if (gruppo === 'Master') {
      if (eta < 25) return {cat:'Fuori cat.', badge:'b-grigio'};
      const fascia = Math.floor((eta - 25) / 5);
      const min = 25 + fascia * 5;
      const max = min + 4;
      return {cat: min >= 80 ? 'M80+' : `M${min}-${max}`, badge:'b-rosso'};
    }

    // Agonistico: maschi
    if (sesso === 'M') {
      if (eta <= 7)  return {cat:'Promozionale', badge:'b-grigio'};
      if (eta <= 9)  return {cat:'Esordienti A', badge:'b-verde'};
      if (eta <= 11) return {cat:'Esordienti B', badge:'b-verde'};
      if (eta <= 13) return {cat:'Ragazzi',      badge:'b-blu'};
      if (eta <= 17) return {cat:'Juniores',     badge:'b-viola'};
      return             {cat:'Assoluti',        badge:'b-oro'};
    }
    // Agonistico: femmine
    if (eta <= 6)  return {cat:'Promozionale',   badge:'b-grigio'};
    if (eta <= 8)  return {cat:'Esordienti A',   badge:'b-verde'};
    if (eta <= 10) return {cat:'Esordienti B',   badge:'b-verde'};
    if (eta <= 12) return {cat:'Ragazze',        badge:'b-blu'};
    if (eta <= 16) return {cat:'Juniores',       badge:'b-viola'};
    return             {cat:'Assoluti/Senior',   badge:'b-oro'};
  } catch(e) { return {cat:'--', badge:'b-grigio'}; }
}

function formattaData(raw) {
  const d = raw.replace(/\D/g,'');
  if (d.length === 8) return d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);
  return raw;
}

// ═══════════════════════════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════════════════════════
function avviaSB(url, key) {
  try { DB.sb = supabase.createClient(url, key); } catch(e) { DB.sb = null; }
}

async function sincronizzaSu(tabella, dati) {
  if (!DB.sb) return;
  try { await DB.sb.from(tabella).upsert(dati); } catch(e) {}
}

async function sincronizzaDa() {
  if (!DB.sb) return toast('Nessuna connessione cloud', 'err');
  try {
    const [ra, rm] = await Promise.all([
      DB.sb.from('atleti').select('*'),
      DB.sb.from('meetings').select('*'),
    ]);
    if (ra.data?.length) { DB.atleti = ra.data; LS.salva('atleti', ra.data); }
    if (rm.data?.length) {
      DB.meetings = rm.data.map(m => ({
        ...m, _pags: typeof m.pagamenti==='string' ? JSON.parse(m.pagamenti||'{}') : (m.pagamenti||{})
      }));
      LS.salva('meetings', DB.meetings);
    }
    toast('Dati sincronizzati ✓');
    render();
  } catch(e) { toast('Errore sync: '+e.message,'err'); }
}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
let timerToast;
function toast(msg, tipo='ok') {
  const vecchio = document.querySelector('.toast');
  if (vecchio) vecchio.remove();
  clearTimeout(timerToast);
  const el = document.createElement('div');
  el.className = 'toast '+tipo;
  el.textContent = msg;
  document.body.appendChild(el);
  timerToast = setTimeout(() => el.remove(), 3200);
}

// ═══════════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════════
let PAGINA = 'meeting';
let DETTAGLIO_MEETING = null;
let CERCA_ATL = '';
let FILTRO_GRP = 'tutti';
let STATO_MODAL = {};
let IDS_SEL = [];

function vai(p) { PAGINA = p; DETTAGLIO_MEETING = null; render(); }
function chiudiModal() { STATO_MODAL = {}; const ov = document.querySelector('.overlay'); if(ov) ov.remove(); }

// ═══════════════════════════════════════════════════════════
// RENDER PRINCIPALE
// ═══════════════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (!DB.config) { app.innerHTML = htmlSetup(); return; }
  app.innerHTML = `
    <div class="header">
      <div class="logo-wrap">
        <div class="logo-ico">🏊</div>
        <div>
          <div class="logo-nome">SWIMPAY</div>
          <div class="logo-sub">${DB.config.nomeSocieta||'Meeting Manager'} · Stagione 2025/2026</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn ${PAGINA==='meeting'?'attivo':''}" onclick="vai('meeting')">📋 Meeting</button>
        <button class="nav-btn ${PAGINA==='atleti'?'attivo':''}" onclick="vai('atleti')">🏊 Atleti</button>
        <button class="nav-btn ${PAGINA==='config'?'attivo':''}" onclick="vai('config')">⚙️ Config</button>
        <button class="btn btn-fantasma btn-sm" onclick="sincronizzaDa()" style="margin-left:8px;padding:7px 12px">↻ Sincronizza</button>
      </nav>
    </div>
    <div class="main">
      ${PAGINA==='meeting' ? renderMeeting() : ''}
      ${PAGINA==='atleti'  ? renderAtleti()  : ''}
      ${PAGINA==='config'  ? renderConfig()  : ''}
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════════
function htmlSetup() {
  return `
  <div class="corsie"></div>
  <div class="main" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding-top:0">
  <div class="setup-wrap">
    <div style="font-size:56px;margin-bottom:14px">🏊‍♂️</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:900;letter-spacing:3px;color:var(--acqua-brillante);margin-bottom:6px">SWIMPAY</div>
    <div style="color:var(--testo-mut);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">Gestione Pagamenti Meeting · FIN 2025/2026</div>
    <div class="card" style="text-align:left;margin-top:24px">
      <div class="onda"></div>
      <div class="fg">
        <label class="etichetta">Nome Società</label>
        <input class="inp" id="s-soc" placeholder="es. Albatros S.C." />
      </div>
      <div class="cfg">
        <div class="cfg-titolo">☁️ Connessione Supabase (sync PC ↔ Cellulare)</div>
        <p style="font-size:12px;color:var(--testo-mut);margin-bottom:10px">
          Inserisci le credenziali del tuo progetto Supabase per la sincronizzazione cloud.
        </p>
        <div class="fg">
          <label class="etichetta">Project URL</label>
          <input class="inp" id="s-url" placeholder="https://xxxxx.supabase.co" />
        </div>
        <div class="fg" style="margin:0">
          <label class="etichetta">Chiave Pubblicabile (anon key)</label>
          <input class="inp" id="s-key" placeholder="sb_publishable_..." />
        </div>
        <div class="pre">-- Esegui nell'Editor SQL di Supabase:
CREATE TABLE atleti (id text PRIMARY KEY, nome text, cognome text, data_nascita text, sesso text, tessera text, gruppo text, categoria text);
CREATE TABLE meetings (id text PRIMARY KEY, nome text, data text, luogo text, note text, gruppi text, costo_gara real, costo_staffetta real, staffetta_mode text, pagamenti text);
ALTER TABLE atleti ENABLE ROW LEVEL SECURITY;
ALTER TABLE meetings ENABLE ROW LEVEL SECURITY;
CREATE POLICY "aperto" ON atleti FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "aperto" ON meetings FOR ALL USING (true) WITH CHECK (true);</div>
      </div>

function importaExcel(input) {
  const file = input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'binary', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const dati = XLSX.utils.sheet_to_json(ws);
      const nuovi = dati.map((riga, i) => {
        const nome     = String(riga['Nome']||riga['nome']||riga['NOME']||'').trim();
        const cognome  = String(riga['Cognome']||riga['cognome']||riga['COGNOME']||'').trim();
        const rawD     = riga['Data Nascita']||riga['data_nascita']||riga['DataNascita']||riga['DATA_NASCITA']||'';
        const sesso    = String(riga['Sesso']||riga['sesso']||'M').toUpperCase().charAt(0);
        const tessera  = String(riga['Tessera']||riga['tessera']||riga['Numero Tessera']||'');
        const gruppo   = String(riga['Gruppo']||riga['gruppo']||'');
        let dn = '';
        if (rawD instanceof Date) {
          dn = String(rawD.getDate()).padStart(2,'0')+'/'+String(rawD.getMonth()+1).padStart(2,'0')+'/'+rawD.getFullYear();
        } else if (typeof rawD === 'number') {
          const d = XLSX.SSF.parse_date_code(rawD);
          dn = String(d.d).padStart(2,'0')+'/'+String(d.m).padStart(2,'0')+'/'+d.y;
        } else if (rawD) {
          dn = formattaData(String(rawD));
        }
        const c = catFIN(dn, sesso, gruppo);
        return {id:'a_'+Date.now()+'_'+i, nome, cognome, data_nascita:dn, sesso, tessera, gruppo: gruppo||c.cat, categoria:c.cat};
      }).filter(a=>a.nome||a.cognome);

      const aggiornati = [...DB.atleti];
      nuovi.forEach(n => {
        const idx = aggiornati.findIndex(e=>e.nome===n.nome&&e.cognome===n.cognome);
        if (idx>=0) aggiornati[idx]={...aggiornati[idx],...n}; else aggiornati.push(n);
      });
      DB.atleti = aggiornati; LS.salva('atleti', aggiornati);
      sincronizzaSu('atleti', aggiornati);
      toast('✓ Importati '+nuovi.length+' atleti');
      render();
    } catch(e) { toast('Errore importazione: '+e.message,'err'); }
  };
  r.readAsBinaryString(file);
  input.value='';
}

function eliminaAtleta(id) {
  if (!confirm('Eliminare questo atleta?')) return;
  DB.atleti = DB.atleti.filter(a=>a.id!==id);
  LS.salva('atleti', DB.atleti); sincronizzaSu('atleti', DB.atleti);
  toast('Atleta eliminato'); render();

function aggiornaPag(meetingId, atletaId, campo, val) {
  const m = DB.meetings.find(x=>x.id===meetingId);
  if (!m) return;
  if (!m._pags) m._pags = {};
  if (!m._pags[atletaId]) m._pags[atletaId] = {gare:0, staffette:0, pagato:0, dovuto:0};
  m._pags[atletaId][campo] = parseFloat(val)||0;
  if (campo==='gare'||campo==='staffette') {
    const cg = parseFloat(m.costo_gara)||0;
    const cs = parseFloat(m.costo_staffetta)||0;
    m._pags[atletaId].dovuto = m._pags[atletaId].gare * cg + m._pags[atletaId].staffette * cs;
    // Aggiorna visivamente il campo dovuto senza re-render completo
    const righe = document.querySelectorAll('.riga-pag');
    righe.forEach(riga => {
      const inputs = riga.querySelectorAll('input');
      const divs = riga.querySelectorAll('div');
    });
  }
}

function salvaPagamenti(meetingId) {
  const m = DB.meetings.find(x=>x.id===meetingId);
  if (!m) return;
  m.pagamenti = m._pags || {};
  DB.meetings = DB.meetings.map(x=>x.id===meetingId?m:x);
  LS.salva('meetings', DB.meetings);
  const perSync = DB.meetings.map(x=>({...x, pagamenti:JSON.stringify(x._pags||x.pagamenti||{})}));
  sincronizzaSu('meetings', perSync);
  toast('Pagamenti salvati ✓');
  render();
}

function eliminaMeeting(id) {
  if (!confirm('Eliminare questo meeting?')) return;
  DB.meetings = DB.meetings.filter(m=>m.id!==id);
  LS.salva('meetings', DB.meetings); sincronizzaSu('meetings', DB.meetings);
  DETTAGLIO_MEETING = null; toast('Meeting eliminato'); render();
}

async function testaSB() {
  const url = document.getElementById('cfg-url').value.trim();
  const key = document.getElementById('cfg-key').value.trim();
  const ris = document.getElementById('test-ris');
  if (!url||!key) { ris.innerHTML='<div style="color:#fca5a5;font-size:13px">⚠️ Inserisci URL e Chiave</div>'; return; }
  try {
    const cl = supabase.createClient(url,key);
    const {error} = await cl.from('atleti').select('id').limit(1);
    if (error) throw error;
    ris.innerHTML='<div style="color:#86efac;font-size:13px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:7px;padding:9px 13px">✅ Connessione riuscita! Database raggiungibile.</div>';
  } catch(e) {
    ris.innerHTML=`<div style="color:#fca5a5;font-size:13px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:7px;padding:9px 13px">❌ ${e.message}</div>`;
  }
}

function salvaConfig() {
  const cfg = {
    nomeSocieta: document.getElementById('cfg-soc').value.trim()||'SwimPay',
    supabaseUrl: document.getElementById('cfg-url').value.trim(),
    supabaseKey: document.getElementById('cfg-key').value.trim(),
  };
  DB.config = cfg; LS.salva('config', cfg);
  if (cfg.supabaseUrl && cfg.supabaseKey) avviaSB(cfg.supabaseUrl, cfg.supabaseKey);
  toast('Impostazioni salvate ✓'); render();
}

function apriNuovoAtleta() { STATO_MODAL={tipo:'atleta', dati:{nome:'',cognome:'',data_nascita:'',sesso:'M',tessera:'',gruppo:''}}; mostraModal(); }
function apriModificaAtleta(id) { const a=DB.atleti.find(x=>x.id===id); if(!a)return; STATO_MODAL={tipo:'atleta',id,dati:{...a},dateRaw:a.data_nascita?.replace(/\//g,'')||''}; mostraModal(); }
function apriNuovoMeeting() { STATO_MODAL={tipo:'meeting',dati:{nome:'',data:'',luogo:'',note:'',gruppi:[],costo_gara:'',costo_staffetta:'',staffetta_mode:'per_atleta'}}; mostraModal(); }
function apriModificaMeeting(id) { const m=DB.meetings.find(x=>x.id===id); if(!m)return; const g=typeof m.gruppi==='string'?(m.gruppi?m.gruppi.split(','):[]):(m.gruppi||[]); STATO_MODAL={tipo:'meeting',id,dati:{...m,gruppi:g}}; mostraModal(); }
function apriSelAtleti(mid) { STATO_MODAL={tipo:'selezione',meetingId:mid,cerca:'',filtroG:'tutti'}; IDS_SEL=[...Object.keys(DB.meetings.find(x=>x.id===mid)?._pags||{})]; mostraModal(); }

function mostraModal() {
  const vecchio = document.querySelector('.overlay');
  if (vecchio) vecchio.remove();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.onclick = e => { if(e.target===ov) chiudiModal(); };
  ov.innerHTML = htmlModal();
  document.body.appendChild(ov);
}

function htmlModal() {
  const {tipo, dati, id} = STATO_MODAL;
  if (tipo==='atleta')    return htmlModalAtleta(dati, id);
  if (tipo==='meeting')   return htmlModalMeeting(dati, id);
  if (tipo==='selezione') return htmlModalSelezione();
  return '';
}

function onInputData(val) {
  const d = val.replace(/\D/g,'').slice(0,8);
  STATO_MODAL.dateRaw = d;
  STATO_MODAL.dati.data_nascita = d.length===8 ? d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4) : '';
  const inp = document.getElementById('m-dat');
  if (inp) {
    const disp = d.length>=2?(d.length>=4?(d.length>=8?
      d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):
      d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4)):
      d.slice(0,2)+'/'+d.slice(2)):d;
    inp.value = disp;
  }
  aggiornaCat();
}

function aggiornaCat() {
  const el = document.getElementById('cat-disp');
  if (!el) return;
  const c = catFIN(STATO_MODAL.dati.data_nascita, STATO_MODAL.dati.sesso, STATO_MODAL.dati.gruppo);
  el.className = 'badge '+c.badge;
  el.textContent = c.cat;
}

function impostaSesso(s) {
  STATO_MODAL.dati.sesso = s;
  document.querySelectorAll('.modal .topt').forEach(b=>{
    if (b.textContent.includes('Maschio')||b.textContent.includes('Femmina')) {
      b.classList.toggle('attivo',(s==='M'&&b.textContent.includes('Maschio'))||(s==='F'&&b.textContent.includes('Femmina')));
    }
  });
  aggiornaCat();
}

function toggleGruppoMeeting(g, btn) {
  const grps = STATO_MODAL.dati.gruppi || [];
  if (grps.includes(g)) { STATO_MODAL.dati.gruppi=grps.filter(x=>x!==g); btn.classList.remove('btn-primario'); btn.classList.add('btn-fantasma'); }
  else { STATO_MODAL.dati.gruppi=[...grps,g]; btn.classList.remove('btn-fantasma'); btn.classList.add('btn-primario'); }
}

function impostaModalitaStaff(val, btn) {
  STATO_MODAL.dati.staffetta_mode = val;
  document.querySelectorAll('.modal .toggle .topt').forEach(b=>b.classList.remove('attivo'));
  btn.classList.add('attivo');
}

function salvaAtleta(id) {
  const nome = document.getElementById('m-nom').value.trim();
  const cognome = document.getElementById('m-cog').value.trim();
  if (!nome||!cognome) { toast('Nome e cognome obbligatori','err'); return; }
  const sesso = STATO_MODAL.dati.sesso||'M';
  const gruppo = document.getElementById('m-grp').value;
  const data_nascita = STATO_MODAL.dati.data_nascita||'';
  const tessera = document.getElementById('m-tes').value.trim();
  const c = catFIN(data_nascita, sesso, gruppo);
  const obj = {nome, cognome, sesso, gruppo, data_nascita, tessera, categoria:c.cat};
  if (id) { DB.atleti = DB.atleti.map(a=>a.id===id?{...a,...obj}:a); }
  else { DB.atleti.push({...obj, id:'a_'+Date.now()}); }
  LS.salva('atleti', DB.atleti); sincronizzaSu('atleti', DB.atleti);
  toast(id?'Atleta aggiornato ✓':'Atleta aggiunto ✓');
  chiudiModal(); render();
}

function salvaMeeting(id) {
  const nome = document.getElementById('m-mnome').value.trim();
  if (!nome) { toast('Nome meeting obbligatorio','err'); return; }
  const grps = STATO_MODAL.dati.gruppi||[];
  const obj = {
    nome,
    data:    document.getElementById('m-mdata').value,
    luogo:   document.getElementById('m-mluogo').value.trim(),
    note:    document.getElementById('m-mnote').value.trim(),
    gruppi:  grps.join(','),
    costo_gara:       parseFloat(document.getElementById('m-mcg').value)||0,
    costo_staffetta:  parseFloat(document.getElementById('m-mcs').value)||0,
    staffetta_mode:   STATO_MODAL.dati.staffetta_mode||'per_atleta',
  };
  if (id) {
    DB.meetings = DB.meetings.map(m=>m.id===id?{...m,...obj}:m);
    if (DETTAGLIO_MEETING?.id===id) DETTAGLIO_MEETING = DB.meetings.find(m=>m.id===id);
  } else {
    DB.meetings.push({...obj, id:'m_'+Date.now(), pagamenti:{}, _pags:{}});
  }
  LS.salva('meetings', DB.meetings);
  const perSync = DB.meetings.map(x=>({...x, pagamenti:JSON.stringify(x._pags||x.pagamenti||{})}));
  sincronizzaSu('meetings', perSync);
  toast(id?'Meeting aggiornato ✓':'Meeting creato ✓');
  chiudiModal(); render();
}

function toggleSelAtleta(id, el) {
  if (IDS_SEL.includes(id)) IDS_SEL=IDS_SEL.filter(x=>x!==id);
  else IDS_SEL.push(id);
  const chk = el.querySelector('.checkbox');
  el.classList.toggle('selezionato', IDS_SEL.includes(id));
  if (chk) { chk.classList.toggle('attivo', IDS_SEL.includes(id)); chk.innerHTML=IDS_SEL.includes(id)?'<span style="color:#fff;font-size:11px">✓</span>':''; }
  const cnt = document.querySelector('.overlay span[style*="12px"]');
  if (cnt) cnt.textContent = IDS_SEL.length+' atleti selezionati';
}

function confermaSelAtleti(meetingId) {
  const m = DB.meetings.find(x=>x.id===meetingId);
  if (!m) return;
  const pags = m._pags || {};
  const nuoviPags = {};
  IDS_SEL.forEach(id => { nuoviPags[id] = pags[id]||{gare:0,staffette:0,pagato:0,dovuto:0}; });
  m._pags = nuoviPags; m.pagamenti = nuoviPags;
  DETTAGLIO_MEETING = m;
  chiudiModal(); render();
}

// ═══════════════════════════════════════════════════════════
// INIZIALIZZAZIONE
// ═══════════════════════════════════════════════════════════
(function init() {
  DB.config   = LS.prendi('config');
  DB.atleti   = LS.prendi('atleti') || [];
  DB.meetings = (LS.prendi('meetings') || []).map(m => ({
    ...m,
    _pags: typeof m.pagamenti==='string' ? JSON.parse(m.pagamenti||'{}') : (m._pags||m.pagamenti||{})
  }));
  if (DB.config?.supabaseUrl && DB.config?.supabaseKey) {
    avviaSB(DB.config.supabaseUrl, DB.config.supabaseKey);
  }
  render();
})();
</script>


<style>

.btn-s{background:#166534;color:#bbf7d0}.btn-s:hover{background:#15803d}

.sval{font-size:24px;font-weight:800;margin-top:4px}

.tbl td{padding:9px 10px;border-bottom:1px solid rgba(66,180,245,.05)}
.tbl tr:hover td{background:rgba(66,180,245,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.b-blue{background:rgba(30,136,229,.18);color:#7dd3fc}
.b-green{background:rgba(34,197,94,.18);color:#86efac}
.b-gold{background:rgba(251,191,36,.18);color:#fde68a}

.ov{position:fixed;inset:0;background:rgba(5,12,25,.87);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}

.ai{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;border:1px solid rgba(66,180,245,.13);cursor:pointer;transition:all .2s;margin-bottom:5px}
.ai:hover{border-color:rgba(66,180,245,.35);background:rgba(66,180,245,.04)}
.ai.sel{border-color:#1565a0;background:rgba(21,101,160,.14)}
.chk{width:17px;height:17px;border-radius:4px;border:2px solid rgba(66,180,245,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.chk.on{background:#1565a0;border-color:#1565a0}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(21,101,160,.14);border:1px solid rgba(66,180,245,.18);border-radius:20px;padding:4px 10px;font-size:11px;color:#7dd3fc}
.pi{display:inline-flex;align-items:center;gap:4px;background:rgba(21,101,160,.12);border:1px solid rgba(66,180,245,.15);border-radius:5px;padding:4px 10px;font-size:12px;color:#7dd3fc;font-weight:600}
.pbar{height:5px;background:#0d2137;border-radius:3px;overflow:hidden;margin-top:3px}
.pfill{height:100%;border-radius:3px;transition:width .3s}
.note-box{background:#0d2137;border-left:3px solid #1565a0;border-radius:0 7px 7px 0;padding:11px 14px;font-size:13px;color:#7dd3fc;white-space:pre-wrap;line-height:1.5}
.cfg{background:rgba(21,101,160,.08);border:1px solid rgba(66,180,245,.18);border-radius:8px;padding:14px;margin-bottom:14px}
.cfg-ttl{font-size:11px;font-weight:800;color:#fbbf24;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.pin{width:100%;padding:5px 8px;border-radius:5px;text-align:center;background:#163354;border:1px solid rgba(66,180,245,.15);color:#f0f9ff;font-size:13px;outline:none}
.pin:focus{border-color:rgba(66,180,245,.4)}
.empty{text-align:center;padding:40px 20px;color:#4a7fa5}
.ez{font-size:40px;margin-bottom:10px;opacity:.35}
.et{font-size:15px;color:#7dd3fc;margin-bottom:5px}
.es{font-size:12px}
.mc-row{display:grid;gap:8px;padding:5px 0;border-bottom:1px solid rgba(66,180,245,.05);align-items:center}
.toast{position:fixed;bottom:20px;right:20px;z-index:9999;background:#163354;border:1px solid rgba(66,180,245,.4);border-radius:8px;padding:11px 16px;font-size:13px;font-weight:500;animation:toastIn .25s ease}
.toast.ok{border-color:rgba(34,197,94,.45);color:#86efac}
.toast.err{border-color:rgba(239,68,68,.45);color:#fca5a5}

.setup-wrap{max-width:460px;margin:50px auto;text-align:center}
.pre{background:#0d2137;padding:10px;border-radius:7px;font-size:10px;color:#7dd3fc;overflow-x:auto;text-align:left;margin-top:8px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:#0a1628}::-webkit-scrollbar-thumb{background:#0e3a5c;border-radius:2px}
</style>

<div class="pool-lanes"></div>
<div class="shell" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
// ── STATO GLOBALE ───────────────────────────────────────────────────────
let DB = {
  atleti: [],
  meetings: [],
  config: null,
  sb: null,
};

// ── LOCAL STORAGE ───────────────────────────────────────────────────────
const LS = {
  g: k => { try { return JSON.parse(localStorage.getItem('sp_'+k)||'null') } catch { return null } },
  s: (k,v) => { try { localStorage.setItem('sp_'+k, JSON.stringify(v)) } catch {} },
};

// ── FIN CATEGORIE ───────────────────────────────────────────────────────
function catFIN(dataNascita, sesso, gruppo) {
  if (!dataNascita || !sesso) return {cat:'--', badge:'b-gray'};
  try {
    const p = dataNascita.split('/');
    const anno = parseInt(p[2]);
    const mese = parseInt(p[1]);
    const stagRef = (mese >= 10) ? 2025 : 2024;
    const eta = stagRef - anno;

    if (gruppo === 'Master') {
      if (eta < 25) return {cat:'Fuori cat.', badge:'b-gray'};
      const f = Math.floor((eta-25)/5);
      const min = 25+f*5, max = min+4;
      return {cat: max >= 80 ? 'M80+' : `M${min}-${max}`, badge:'b-red'};
    }
    if (sesso === 'M') {
      if (eta <= 7)  return {cat:'Promozionale', badge:'b-gray'};
      if (eta <= 9)  return {cat:'Esordienti A', badge:'b-green'};
      if (eta <= 11) return {cat:'Esordienti B', badge:'b-green'};
      if (eta <= 13) return {cat:'Ragazzi', badge:'b-blue'};
      if (eta <= 17) return {cat:'Juniores', badge:'b-purple'};
      return {cat:'Assoluti', badge:'b-gold'};
    } else {
      if (eta <= 6)  return {cat:'Promozionale', badge:'b-gray'};
      if (eta <= 8)  return {cat:'Esordienti A', badge:'b-green'};
      if (eta <= 10) return {cat:'Esordienti B', badge:'b-green'};
      if (eta <= 12) return {cat:'Ragazze', badge:'b-blue'};
      if (eta <= 16) return {cat:'Juniores', badge:'b-purple'};
      return {cat:'Assoluti/Senior', badge:'b-gold'};
    }
  } catch(e) { return {cat:'--', badge:'b-gray'}; }
}

function fmtDate(raw) {
  const d = raw.replace(/\D/g,'');
  if (d.length === 8) return d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);
  return raw;
}

// ── SUPABASE ─────────────────────────────────────────────────────────────
function initSB(url, key) {
  try { DB.sb = supabase.createClient(url, key); } catch(e) { DB.sb = null; }
}

async function syncUp(table, data) {
  if (!DB.sb) return;
  try { await DB.sb.from(table).upsert(data); } catch(e) {}
}

async function syncDown() {
  if (!DB.sb) return;
  try {
    const [ra, rm] = await Promise.all([
      DB.sb.from('atleti').select('*'),
      DB.sb.from('meetings').select('*'),
    ]);
    if (ra.data?.length) { DB.atleti = ra.data; LS.s('atleti', ra.data); }
    if (rm.data?.length) { DB.meetings = rm.data; LS.s('meetings', rm.data); }
    toast('Dati sincronizzati dal cloud ✓');
    render();
  } catch(e) { toast('Errore sync: '+e.message, 'err'); }
}

// ── TOAST ─────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type='ok') {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  clearTimeout(toastTimer);
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

// ── ROUTER ────────────────────────────────────────────────────────────────
let PAGE = 'meetings';
let MODAL = null;
let MEETING_DETAIL = null;
let SEARCH_ATL = '';
let FILTER_GRP = 'tutti';

function go(page) { PAGE = page; MEETING_DETAIL = null; render(); }
function openModal(m) { MODAL = m; renderModal(); }
function closeModal() { MODAL = null; const ov = document.querySelector('.ov'); if(ov) ov.remove(); }

// ── MAIN RENDER ───────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (!DB.config) { app.innerHTML = setupHTML(); bindSetup(); return; }
  app.innerHTML = `
    <div class="hdr">
      <div class="logo-wrap">
        <div class="logo-ico">🏊</div>
        <div>
          <div class="logo-name">SWIMPAY</div>
          <div class="logo-tag">Meeting Manager · ${DB.config.nomeScuola||''}</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn ${PAGE==='meetings'?'on':''}" onclick="go('meetings')">📋 Meeting</button>
        <button class="nav-btn ${PAGE==='atleti'?'on':''}" onclick="go('atleti')">🏊 Atleti</button>
        <button class="nav-btn ${PAGE==='cfg'?'on':''}" onclick="go('cfg')">⚙️ Config</button>
        <button class="btn btn-g btn-sm" onclick="syncDown()" style="margin-left:8px;padding:7px 12px">↻ Sync</button>
      </nav>
    </div>
    <div class="main">
      ${PAGE==='meetings' ? renderMeetings() : ''}
      ${PAGE==='atleti' ? renderAtleti() : ''}
      ${PAGE==='cfg' ? renderCfg() : ''}
    </div>`;
  bindPage();
}

// ── SETUP ─────────────────────────────────────────────────────────────────
function setupHTML() {
  return `
  <div class="main" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding-top:0">
  <div class="setup-wrap">
    <div style="font-size:60px;margin-bottom:14px">🏊‍♂️</div>
    <div style="font-size:38px;font-weight:900;letter-spacing:3px;color:#42b4f5;margin-bottom:6px">SWIMPAY</div>
    <div style="color:#4a7fa5;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px">Meeting Payment Manager</div>
    <div class="card" style="text-align:left">
      <div class="wave"></div>
      <div class="fg">
        <label class="lbl">Nome Società</label>
        <input class="inp" id="s-soc" placeholder="es. Albatros S.C." />
      </div>
      <div class="cfg">
        <div class="cfg-ttl">☁️ Supabase Cloud (sync PC ↔ Cellulare)</div>
        <p style="font-size:12px;color:#4a7fa5;margin-bottom:10px">Crea account gratuito su <b style="color:#42b4f5">supabase.com</b> → Nuovo progetto → Settings → API</p>
        <div class="fg">
          <label class="lbl">Project URL</label>
          <input class="inp" id="s-url" placeholder="https://xxxxx.supabase.co" />
        </div>
        <div class="fg" style="margin:0">
          <label class="lbl">Anon / Public Key</label>
          <input class="inp" id="s-key" placeholder="eyJhbGciOiJ..." />
        </div>
        <div class="pre">-- Esegui nel SQL Editor di Supabase:
CREATE TABLE atleti (id text PRIMARY KEY, nome text, cognome text, data_nascita text, sesso text, tessera text, gruppo text, categoria text);
CREATE TABLE meetings (id text PRIMARY KEY, nome text, data text, luogo text, note text, gruppi text, costo_gara real, costo_staffetta real, staffetta_mode text, pagamenti text);
ALTER TABLE atleti ENABLE ROW LEVEL SECURITY;
ALTER TABLE meetings ENABLE ROW LEVEL SECURITY;
CREATE POLICY "open" ON atleti FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "open" ON meetings FOR ALL USING (true) WITH CHECK (true);</div>
      </div>
      <button class="btn btn-p" style="width:100%;padding:12px;font-size:15px;margin-top:14px;letter-spacing:1px;text-transform:uppercase" onclick="doSetup()">🚀 Avvia SwimPay</button>
      <button class="btn btn-g" style="width:100%;padding:10px;margin-top:8px;font-size:13px" onclick="doSetupLocal()">💾 Avvia solo locale (senza sync)</button>
    </div>
  </div></div>`;
}

function bindSetup() {}

function doSetup() {
  const soc = document.getElementById('s-soc').value.trim();
  const url = document.getElementById('s-url').value.trim();
  const key = document.getElementById('s-key').value.trim();
  const cfg = {nomeScuola: soc||'SwimPay', supabaseUrl: url, supabaseKey: key};
  DB.config = cfg; LS.s('config', cfg);
  if (url && key) initSB(url, key);
  toast('Configurazione salvata ✓');
  render();
}

function doSetupLocal() {
  const soc = document.getElementById('s-soc')?.value.trim()||'SwimPay';
  const cfg = {nomeScuola: soc, supabaseUrl:'', supabaseKey:''};
  DB.config = cfg; LS.s('config', cfg);
  toast('Avviato in modalità locale');
  render();
}

// ── ATLETI PAGE ───────────────────────────────────────────────────────────
function renderAtleti() {
  const q = SEARCH_ATL.toLowerCase();
  const grps = ['tutti', ...new Set(DB.atleti.map(a=>a.gruppo).filter(Boolean))];
  const filtered = DB.atleti.filter(a => {
    const m = `${a.nome} ${a.cognome} ${a.tessera||''}`.toLowerCase().includes(q);
    const g = FILTER_GRP==='tutti' || a.gruppo===FILTER_GRP;
    return m && g;
  });

  const rows = filtered.length ? filtered.map((a,i) => {
    const c = catFIN(a.data_nascita, a.sesso, a.gruppo);
    return `<tr>
      <td style="color:#4a7fa5;font-size:11px">${i+1}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="av">${(a.nome?.[0]||'')}${(a.cognome?.[0]||'')}</div>
        <div><div style="font-weight:600;font-size:13px">${a.cognome||''} ${a.nome||''}</div></div>
      </div></td>
      <td style="font-family:monospace;font-size:12px">${a.data_nascita||'-'}</td>
      <td><span class="badge ${a.sesso==='F'?'b-red':'b-blue'}">${a.sesso||'-'}</span></td>
      <td><span class="badge ${c.badge}">${c.cat}</span></td>
      <td style="color:#7dd3fc;font-size:12px">${a.gruppo||'-'}</td>
      <td style="font-family:monospace;font-size:11px;color:#4a7fa5">${a.tessera||'-'}</td>
      <td><div style="display:flex;gap:4px">
        <button class="btn btn-g btn-sm" onclick="openEditAtleta('${a.id}')">✏️</button>
        <button class="btn btn-d btn-sm" onclick="delAtleta('${a.id}')">🗑</button>
      </div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="8"><div class="empty"><div class="ez">🏊‍♂️</div><div class="et">Nessun atleta trovato</div><div class="es">Aggiungi atleti manualmente o importa da Excel</div></div></td></tr>`;

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
    <div class="stitle" style="margin:0">👥 Anagrafica Atleti</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-g" onclick="document.getElementById('xls-in').click()">📥 Importa Excel</button>
      <input type="file" id="xls-in" accept=".xlsx,.xls,.csv" style="display:none" onchange="importXLS(this)">
      <button class="btn btn-p" onclick="openNewAtleta()">+ Nuovo Atleta</button>
    </div>
  </div>
  <div class="wave"></div>
  <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <div class="srch" style="flex:1;min-width:180px;margin:0">
      <span>🔍</span>
      <input value="${SEARCH_ATL}" oninput="SEARCH_ATL=this.value;render()" placeholder="Cerca nome, cognome, tessera..." />
    </div>
    <div class="toggle">
      ${grps.map(g=>`<button class="topt ${FILTER_GRP===g?'on':''}" onclick="FILTER_GRP='${g}';render()">${g==='tutti'?'Tutti':g}</button>`).join('')}
    </div>
    <span class="pill">${filtered.length} atleti</span>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <table class="tbl">
      <thead><tr><th>#</th><th>Atleta</th><th>Nascita</th><th>Sesso</th><th>Categoria</th><th>Gruppo</th><th>Tessera</th><th>Azioni</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function importXLS(input) {
  const file = input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'binary', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws);
      const nuovi = data.map((row, i) => {
        const nome = String(row['Nome']||row['nome']||row['NOME']||'').trim();
        const cognome = String(row['Cognome']||row['cognome']||row['COGNOME']||'').trim();
        const rawD = row['Data Nascita']||row['data_nascita']||row['DataNascita']||row['DATA_NASCITA']||'';
        const sesso = String(row['Sesso']||row['sesso']||'M').toUpperCase().charAt(0);
        const tessera = String(row['Tessera']||row['tessera']||row['Numero Tessera']||'');
        const gruppo = String(row['Gruppo']||row['gruppo']||'');
        let dn = '';
        if (rawD instanceof Date) {
          dn = String(rawD.getDate()).padStart(2,'0')+'/'+String(rawD.getMonth()+1).padStart(2,'0')+'/'+rawD.getFullYear();
        } else if (typeof rawD === 'number') {
          const d = XLSX.SSF.parse_date_code(rawD);
          dn = String(d.d).padStart(2,'0')+'/'+String(d.m).padStart(2,'0')+'/'+d.y;
        } else if (rawD) {
          dn = fmtDate(String(rawD));
        }
        const c = catFIN(dn, sesso, gruppo);
        return {id:'a_'+Date.now()+'_'+i, nome, cognome, data_nascita:dn, sesso, tessera, gruppo: gruppo||c.cat, categoria:c.cat};
      }).filter(a=>a.nome||a.cognome);

      const merged = [...DB.atleti];
      nuovi.forEach(n => {
        const di = merged.findIndex(e=>e.nome===n.nome&&e.cognome===n.cognome);
        if (di>=0) merged[di]={...merged[di],...n}; else merged.push(n);
      });
      DB.atleti = merged; LS.s('atleti', merged);
      syncUp('atleti', merged);
      toast('✓ Importati '+nuovi.length+' atleti');
      render();
    } catch(e) { toast('Errore import: '+e.message,'err'); }
  };
  r.readAsBinaryString(file);
  input.value='';
}

function updPag(meetingId, atletaId, field, val) {
  const m = DB.meetings.find(x=>x.id===meetingId);
  if (!m) return;
  if (!m._pags) m._pags = {};
  if (!m._pags[atletaId]) m._pags[atletaId] = {gare:0,staffette:0,pagato:0,dovuto:0};
  m._pags[atletaId][field] = parseFloat(val)||0;
  if (field==='gare'||field==='staffette') {
    const cg = parseFloat(m.costo_gara)||0;
    const cs = parseFloat(m.costo_staffetta)||0;
    m._pags[atletaId].dovuto = m._pags[atletaId].gare*cg + m._pags[atletaId].staffette*cs;
    // Aggiorna la riga dovuto visivamente
    const rows = document.querySelectorAll('.mc-row');
    rows.forEach(row => {
      const ins = row.querySelectorAll('input');
      if (ins.length >= 2) {
        const dovDiv = row.children[3];
        if (dovDiv) {
          const g = parseFloat(row.querySelector('input:nth-child(2)')?.value)||0;
          const s = parseFloat(row.querySelector('input:nth-child(3)')?.value)||0;
        }
      }
    });
  }
}

function savePags(meetingId) {
  const m = DB.meetings.find(x=>x.id===meetingId);
  if (!m) return;
  m.pagamenti = m._pags || {};
  DB.meetings = DB.meetings.map(x=>x.id===meetingId?m:x);
  LS.s('meetings', DB.meetings);
  const toSync = DB.meetings.map(x=>({...x, pagamenti: JSON.stringify(x._pags||x.pagamenti||{})}));
  syncUp('meetings', toSync);
  toast('Pagamenti salvati ✓');
  render();
}

function openEditMeeting(id) { const m = DB.meetings.find(x=>x.id===id); if(!m)return; const grps=typeof m.gruppi==='string'?(m.gruppi?m.gruppi.split(','):[]):(m.gruppi||[]); MODAL_STATE={type:'meeting',id,data:{...m,gruppi:grps}}; renderModal(); }

function renderModal() {
  const old = document.querySelector('.ov');
  if (old) old.remove();
  if (!MODAL_STATE.type) return;
  const ov = document.createElement('div');
  ov.className='ov';
  ov.onclick = e => { if(e.target===ov) closeModal(); };
  ov.innerHTML = getModalHTML();
  document.body.appendChild(ov);
  bindModal();
}

function getModalHTML() {
  const {type, data, id} = MODAL_STATE;
  if (type==='atleta') return atletaModalHTML(data, id);
  if (type==='meeting') return meetingModalHTML(data, id);
  if (type==='sel') return selModalHTML();
  return '';
}

  return `<div class="modal">
    <div class="modal-ttl">${id?'✏️ Modifica':'👤 Nuovo'} Atleta</div>
    <div class="grid2"><div class="fg"><label class="lbl">Cognome *</label><input class="inp" id="m-cog" value="${d.cognome||''}" placeholder="Rossi"></div>
    <div class="fg"><label class="lbl">Nome *</label><input class="inp" id="m-nom" value="${d.nome||''}" placeholder="Mario"></div></div>
    <div class="grid2">
      <div class="fg"><label class="lbl">Data nascita (DDMMYYYY — senza separatori)</label>
        <div style="position:relative"><input class="inp" id="m-dat" value="${disp}" placeholder="15051998" maxlength="10" oninput="onDateInput(this.value)">
        ${d.data_nascita?`<span style="position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:#fbbf24">✓</span>`:''}</div>
        <div style="font-size:10px;color:#4a7fa5;margin-top:3px">Digita solo cifre: es. 15051998</div>
      </div>
      <div class="fg"><label class="lbl">Sesso</label>
        <div class="toggle" style="height:42px;align-items:center">
          <button class="topt ${d.sesso==='M'?'on':''}" style="flex:1" onclick="setMS('M')">♂ M</button>
          <button class="topt ${d.sesso==='F'?'on':''}" style="flex:1" onclick="setMS('F')">♀ F</button>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="fg"><label class="lbl">Gruppo</label>
        <select class="inp" id="m-grp" onchange="MODAL_STATE.data.gruppo=this.value;refreshCat()">
          ${['','Esordienti','Ragazzi','Juniores','Assoluti','Master'].map(g=>`<option value="${g}" ${d.gruppo===g?'selected':''}>${g||'-- Automatico --'}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label class="lbl">N° Tessera FIN</label><input class="inp" id="m-tes" value="${d.tessera||''}" placeholder="FIN-XXXXXX"></div>
    </div>
    ${d.data_nascita?`<div style="display:flex;align-items:center;gap:8px;background:rgba(66,180,245,.07);border:1px solid rgba(66,180,245,.25);border-radius:8px;padding:9px 13px;margin-bottom:14px"><span style="font-size:13px;color:#4a7fa5">Categoria calcolata:</span><span class="badge ${cat.badge}" style="font-size:12px">${cat.cat}</span></div>`:''}
    <div class="mac"><button class="btn btn-g" onclick="closeModal()">Annulla</button><button class="btn btn-p" onclick="saveAtleta(${id?`'${id}'`:'null'})">${id?'💾 Salva':'+ Aggiungi'}</button></div>
  </div>`;
}

function meetingModalHTML(d, id) {
  const gpOpts = ['Esordienti','Ragazzi','Juniores','Assoluti','Master'];
  return `<div class="modal">
    <div class="modal-ttl">${id?'✏️ Modifica':'🏆 Nuovo'} Meeting</div>
    <div class="fg"><label class="lbl">Nome Meeting *</label><input class="inp" id="m-mnome" value="${d.nome||''}" placeholder="Meeting Lorusso 2025"></div>
    <div class="grid2">
      <div class="fg"><label class="lbl">Data</label><input class="inp" type="date" id="m-mdata" value="${d.data||''}"></div>
      <div class="fg"><label class="lbl">Luogo</label><input class="inp" id="m-mluogo" value="${d.luogo||''}" placeholder="San Vito dei Normanni"></div>
    </div>
    <div class="fg"><label class="lbl">Gruppi partecipanti</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="m-grps">
        ${gpOpts.map(g=>`<button class="btn btn-sm ${d.gruppi?.includes(g)?'btn-p':'btn-g'}" onclick="toggleMGrp('${g}',this)">${g}</button>`).join('')}
      </div>
    </div>
    <div class="cfg"><div class="cfg-ttl">💰 Tariffe</div>
      <div class="grid2">
        <div class="fg"><label class="lbl">Costo per gara (€)</label><input class="inp" type="number" step="0.5" id="m-mcg" value="${d.costo_gara||''}" placeholder="5.00"></div>
        <div class="fg"><label class="lbl">Costo staffetta (€)</label><input class="inp" type="number" step="0.5" id="m-mcs" value="${d.costo_staffetta||''}" placeholder="3.00"></div>
      </div>
      <div class="fg" style="margin:0"><label class="lbl">Modalità staffetta</label>
        <div class="toggle">
          <button class="topt ${d.staffetta_mode!=='per_staffetta'?'on':''}" style="flex:1" onclick="setSM('per_atleta',this)">Per atleta</button>
          <button class="topt ${d.staffetta_mode==='per_staffetta'?'on':''}" style="flex:1" onclick="setSM('per_staffetta',this)">Per staffetta</button>
        </div>
      </div>
    </div>
    <div class="fg"><label class="lbl">Note / Info di servizio</label><textarea class="inp" id="m-mnote" rows="3" style="resize:vertical">${d.note||''}</textarea></div>
    <div class="mac"><button class="btn btn-g" onclick="closeModal()">Annulla</button><button class="btn btn-p" onclick="saveMeeting(${id?`'${id}'`:'null'})">${id?'💾 Salva':'+ Crea Meeting'}</button></div>
  </div>`;
}

let SEL_IDS = [];

function selModalHTML() {
  const {meetingId, search, filterG} = MODAL_STATE;
  const m = DB.meetings.find(x=>x.id===meetingId);
  if (!m) return '';
  const pags = m._pags || m.pagamenti || {};
  SEL_IDS = [...Object.keys(pags)];
  const grps = ['tutti',...new Set(DB.atleti.map(a=>a.gruppo).filter(Boolean))];
  const q = (search||'').toLowerCase();
  const filt = DB.atleti.filter(a => {
    const ms = `${a.nome} ${a.cognome}`.toLowerCase().includes(q);
    const mg = filterG==='tutti'||a.gruppo===filterG;
    return ms && mg;
  });
  return `<div class="modal" style="max-width:580px">
    <div class="modal-ttl">👥 Seleziona Atleti Partecipanti</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <div class="srch" style="flex:1;min-width:160px;margin:0"><span>🔍</span><input value="${search||''}" oninput="MODAL_STATE.search=this.value;renderModal()" placeholder="Cerca..."></div>
      <div class="toggle">${grps.map(g=>`<button class="topt ${filterG===g?'on':''}" onclick="MODAL_STATE.filterG='${g}';renderModal()">${g==='tutti'?'Tutti':g}</button>`).join('')}</div>
    </div>
    <div style="max-height:280px;overflow-y:auto">
      ${filt.map(a=>{
        const sel = SEL_IDS.includes(a.id);
        const cat = catFIN(a.data_nascita,a.sesso,a.gruppo);
        return `<div class="ai ${sel?'sel':''}" onclick="toggleSel('${a.id}',this)">
          <div class="chk ${sel?'on':''}">${sel?'<span style="color:#fff;font-size:11px">✓</span>':''}</div>
          <div class="av">${(a.nome?.[0]||'')}${(a.cognome?.[0]||'')}</div>
          <div style="flex:1"><div style="font-size:13px;font-weight:600">${a.cognome||''} ${a.nome||''}</div><div style="font-size:10px;color:#4a7fa5">${a.data_nascita||''} · ${a.tessera||'-'}</div></div>
          <span class="badge ${cat.badge}">${cat.cat}</span>
        </div>`;
      }).join('')}
      ${filt.length===0?'<div class="empty"><div class="et">Nessun atleta trovato</div></div>':''}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(66,180,245,.1)">
      <span style="font-size:12px;color:#4a7fa5">${SEL_IDS.length} selezionati</span>
      <div style="display:flex;gap:8px"><button class="btn btn-g" onclick="closeModal()">Annulla</button><button class="btn btn-p" onclick="confirmSel('${meetingId}')">Conferma</button></div>
    </div>
  </div>`;
}

function toggleSel(id, el) {
  if (SEL_IDS.includes(id)) SEL_IDS = SEL_IDS.filter(x=>x!==id);
  else SEL_IDS.push(id);
  const chk = el.querySelector('.chk');
  el.classList.toggle('sel');
  if (chk) { chk.classList.toggle('on'); chk.innerHTML = SEL_IDS.includes(id)?'<span style="color:#fff;font-size:11px">✓</span>':''; }
  const cnt = document.querySelector('.ov span[style*="12px"]');
  if (cnt) cnt.textContent = SEL_IDS.length+' selezionati';
}

function confirmSel(meetingId) {
  const m = DB.meetings.find(x=>x.id===meetingId);
  if (!m) return;
  const pags = m._pags || {};
  const newPags = {};
  SEL_IDS.forEach(id => { newPags[id] = pags[id] || {gare:0,staffette:0,pagato:0,dovuto:0}; });
  m._pags = newPags; m.pagamenti = newPags;
  closeModal(); MEETING_DETAIL = m; render();
}

function onDateInput(val) {
  const d = val.replace(/\D/g,'').slice(0,8);
  MODAL_STATE.dateRaw = d;
  if (d.length===8) MODAL_STATE.data.data_nascita = d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);
  else MODAL_STATE.data.data_nascita = '';
  const inp = document.getElementById('m-dat');
  if (!inp) return;
  const disp = d.length>=2?(d.length>=4?(d.length>=8?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4)):d.slice(0,2)+'/'+d.slice(2)):d;
  inp.value = disp;
  const cat = catFIN(MODAL_STATE.data.data_nascita, MODAL_STATE.data.sesso, MODAL_STATE.data.gruppo);
  const old = document.querySelector('.modal .badge[data-cat]');
  // update cat display if exists
  refreshCat();
}

function refreshCat() {
  const cat = catFIN(MODAL_STATE.data.data_nascita, MODAL_STATE.data.sesso, MODAL_STATE.data.gruppo);
  const wrap = document.querySelector('#cat-disp');
  if (wrap) { wrap.className = 'badge '+cat.badge; wrap.textContent = cat.cat; }
}

function setMS(s) {
  MODAL_STATE.data.sesso = s;
  document.querySelectorAll('.modal .topt').forEach((b,i)=>{
    if (b.textContent.includes('M')||b.textContent.includes('F')) {
      b.classList.toggle('on', (s==='M'&&b.textContent.includes('M'))||(s==='F'&&b.textContent.includes('F')));
    }
  });
  refreshCat();
}

function toggleMGrp(g, btn) {
  const grps = MODAL_STATE.data.gruppi || [];
  if (grps.includes(g)) { MODAL_STATE.data.gruppi = grps.filter(x=>x!==g); btn.classList.remove('btn-p'); btn.classList.add('btn-g'); }
  else { MODAL_STATE.data.gruppi = [...grps, g]; btn.classList.remove('btn-g'); btn.classList.add('btn-p'); }
}

function setSM(val, btn) {
  MODAL_STATE.data.staffetta_mode = val;
  document.querySelectorAll('.modal .toggle .topt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function saveAtleta(id) {
  const nome = document.getElementById('m-nom').value.trim();
  const cognome = document.getElementById('m-cog').value.trim();
  if (!nome||!cognome) { toast('Nome e cognome obbligatori','err'); return; }
  const sesso = MODAL_STATE.data.sesso||'M';
  const gruppo = document.getElementById('m-grp').value;
  const data_nascita = MODAL_STATE.data.data_nascita||'';
  const tessera = document.getElementById('m-tes').value.trim();
  const cat = catFIN(data_nascita, sesso, gruppo);
  const obj = {nome, cognome, sesso, gruppo, data_nascita, tessera, categoria: cat.cat};
  if (id) { DB.atleti = DB.atleti.map(a=>a.id===id?{...a,...obj}:a); }
  else { DB.atleti.push({...obj, id:'a_'+Date.now()}); }
  LS.s('atleti', DB.atleti); syncUp('atleti', DB.atleti);
  toast(id?'Atleta aggiornato ✓':'Atleta aggiunto ✓');
  closeModal(); render();
}

function saveMeeting(id) {
  const nome = document.getElementById('m-mnome').value.trim();
  if (!nome) { toast('Nome obbligatorio','err'); return; }
  const grps = MODAL_STATE.data.gruppi||[];
  const obj = {
    nome, data: document.getElementById('m-mdata').value,
    luogo: document.getElementById('m-mluogo').value.trim(),
    note: document.getElementById('m-mnote').value.trim(),
    gruppi: grps.join(','),
    costo_gara: parseFloat(document.getElementById('m-mcg').value)||0,
    costo_staffetta: parseFloat(document.getElementById('m-mcs').value)||0,
    staffetta_mode: MODAL_STATE.data.staffetta_mode||'per_atleta',
  };
  if (id) { DB.meetings = DB.meetings.map(m=>m.id===id?{...m,...obj}:m); }
  else { DB.meetings.push({...obj, id:'m_'+Date.now(), pagamenti:{}, _pags:{}}); }
  LS.s('meetings', DB.meetings);
  const toSync = DB.meetings.map(x=>({...x, pagamenti:JSON.stringify(x._pags||x.pagamenti||{})}));
  syncUp('meetings', toSync);
  toast(id?'Meeting aggiornato ✓':'Meeting creato ✓');
  closeModal(); render();
}

function bindPage() {}
function bindModal() {}

// ── INIT ──────────────────────────────────────────────────────────────────
(function init() {
  DB.config = LS.g('config');
  DB.atleti = LS.g('atleti')||[];
  DB.meetings = (LS.g('meetings')||[]).map(m=>{
    const p = typeof m.pagamenti==='string'?JSON.parse(m.pagamenti||'{}'):(m.pagamenti||{});
    return {...m, _pags:p};
  });
  if (DB.config?.supabaseUrl && DB.config?.supabaseKey) initSB(DB.config.supabaseUrl, DB.config.supabaseKey);
  render();
})();
</script>
